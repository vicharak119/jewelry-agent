const {useState,useRef,useEffect}=React,h=React.createElement,F=React.Fragment;

const STYS=[

  {id:"minimal",n:"Minimal",d:"Pure white, clean shadows"},

];

const LITS=["Soft butterfly lighting","Warm side light from left","Diffused window light from upper-right","Rembrandt lighting with fill","Broad even studio light","Loop lighting from 45 degrees"];

}[id]||"";}

// IST (Asia/Kolkata) -> "DD-MMM-YYYY HH:MM:SS AM/PM"
function fmtIST(iso){
  if(!iso)return "-";
  var d=new Date(iso); if(isNaN(d.getTime()))return iso;
  try{
    var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).formatToParts(d);
    var m={};parts.forEach(function(p){m[p.type]=p.value;});
    return m.day+"-"+m.month+"-"+m.year+" "+m.hour+":"+m.minute+":"+m.second+" "+(m.dayPeriod||"").toUpperCase();
  }catch(e){return iso;}
}

async function api(p,o){
  o=o||{};
  var tk=sessionStorage.getItem("jwt"),hd=Object.assign({},o.headers);
  if(tk)hd["Authorization"]="Bearer "+tk;
  if(!(o.body instanceof FormData))hd["Content-Type"]="application/json";
  var r=await fetch(p,Object.assign({},o,{headers:hd}));
  var d=await r.json();if(!r.ok)throw new Error(d.error||"Error "+r.status);return d;
}

function ensureFonts(){
  try{
    if(document.fonts&&document.fonts.load){
      return Promise.all([
        document.fonts.load('bold 20px "Noto Sans Devanagari"'),
        document.fonts.load('italic 12px "Noto Sans Devanagari"')
      ]).then(function(){return document.fonts.ready;}).catch(function(){});
    }
  }catch(e){}
  return Promise.resolve();
}

function App(){
  var[tk,setTk]=useState(sessionStorage.getItem("jwt")||"");

  var sc2={background:t.cd,border:"1px solid "+t.bd,borderRadius:12,padding:16,marginBottom:14};

  function lCfg(){api("/api/settings/public").then(setCfg).catch(function(){});}
  function lUsr(){api("/api/users").then(setUsrs).catch(function(){});}

  // ---- SETUP ----

        h("p",{style:{color:t.t2,fontSize:11,marginBottom:16}},"Min 8 chars, uppercase + number + special char required"),

        h("button",{onClick:function(){setErr("");api("/api/auth/change-password",{method:"POST",body:JSON.stringify({newPassword:npR.current.value})}).then(function(d){sessionStorage.setItem("jwt",d.token);setTk(d.token);setVw("work");lCfg();}).catch(function(e){setErr(e.message);});},style:Object.assign({},sb(true),{width:"100%"})},"Set Password"),
        err?h("div",{style:{color:t.er,fontSize:12,marginTop:10}},"\u26A0 "+err):null
      )
    );
  }

  // ---- WORKSPACE ----
  var isA=usr&&usr.role==="admin";
  var bsy=ph==="analyzing"||ph==="gen"||ph==="brand";

  function upl(f){if(!f)return;setImg(URL.createObjectURL(f));setImgF(f);setAn(null);setFin(null);setPh("idle");setErr("");setSc({d:"",b:"",p:"",m:""});}
  function createNew(){setImg(null);setImgF(null);setAn(null);setFin(null);setExt("");setPh("idle");setSts("");setErr("");setSc({d:"",b:"",p:"",m:""});if(fR.current)fR.current.value="";}

  function doAnalyze(){
    if(!imgF){setErr("Upload image first");return;}
    setErr("");setPh("analyzing");setSts("Analyzing jewelry...");
    var fd=new FormData();fd.append("image",imgF);
    api("/api/analyze",{method:"POST",body:fd}).then(function(d){
      var a=d.analysis;setAn(Object.assign({},a,{inputFile:d.inputFile}));
      setSc({d:a.display||"white mannequin",b:a.background||sf(sty),p:a.props||"",m:a.color_mood||""});
      setPh("scene");setSts("Review the scene, then generate.");
    }).catch(function(e){setErr(e.message);setPh("idle");});
  }

  function doGen(){
    if(!an){setErr("Analyze first");return;}
    setErr("");setPh("gen");setSts("Generating... (30-60 sec)");
    var a=an,ang=ANGS[Math.floor(Math.random()*ANGS.length)],lit=LITS[Math.floor(Math.random()*LITS.length)],seed=Math.floor(Math.random()*99999);
    var pr="Ultra-realistic luxury jewelry product photography.\n\nJEWELRY (MUST MATCH EXACTLY): A "+a.type+" made of "+a.metal+". EXACT elements: "+a.elements+". Chain: "+(a.chain_type||"delicate")+". Style: "+a.style+".\n\nCRITICAL: Reproduce the jewelry design with EXACT fidelity - same number of charms/stones, same shapes, same placement, same chain pattern. Do NOT add, remove, or modify any design element.\n\nDISPLAY: On "+sc.d+".\nSETTING: "+sc.b+". Props: "+sc.p+". Colors: "+sc.m+".\n\nCAMERA: Shot "+ang+". "+lit+". Shallow depth of field, jewelry tack-sharp.\n\nCOMPOSITION: Leave space at the edges clear for a subtle brand bar. NO TEXT/WATERMARKS/LOGOS.\nVariation seed: "+seed+(ext?"\nExtra: "+ext:"");
    api("/api/generate",{method:"POST",body:JSON.stringify({prompt:pr,model:cfg.model,quality:cfg.quality,size:cfg.size,analysis:an,scene:sc,style:sty,inputFile:an.inputFile})}).then(function(d){
      var url=d.b64_json?"data:image/png;base64,"+d.b64_json:d.url;
      if(!url)throw new Error("No image returned");setPh("brand");setSts("Applying brand...");
      doBrand(url);
    }).catch(function(e){setErr(e.message);setPh("scene");});
  }

  function drawText(ctx,bn,tg,pos,logoImg){
    if(pos==="none")return;
    var FF='"Noto Sans Devanagari", Georgia, serif';
    var isB=pos.indexOf("bottom")===0;
    var isL=pos.indexOf("left")>0,isR=pos.indexOf("right")>0,isC=!isL&&!isR;
    var barH=78,pad=26,mg=28;
    var gy0=isB?(1024-barH-pad):0;
    var g=ctx.createLinearGradient(0,isB?gy0:0,0,isB?1024:(barH+pad));
    if(isB){g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(0.35,"rgba(0,0,0,0.4)");g.addColorStop(1,"rgba(0,0,0,0.72)");}
    else{g.addColorStop(0,"rgba(0,0,0,0.72)");g.addColorStop(0.65,"rgba(0,0,0,0.4)");g.addColorStop(1,"rgba(0,0,0,0)");}
    ctx.fillStyle=g;ctx.fillRect(0,isB?gy0:0,1024,barH+pad);
    var cy=isB?(1024-barH/2-6):(barH/2+10);
    ctx.font='bold 22px '+FF;var nameW=ctx.measureText(bn).width;
    ctx.font='italic 13px '+FF;var tagW=tg?ctx.measureText(tg).width:0;
    var textW=Math.max(nameW,tagW);
    var ls=logoImg?46:0,gap=logoImg?14:0,groupW=ls+gap+textW;
    var startX=isC?(1024-groupW)/2:(isL?mg:(1024-mg-groupW));
    var textX=startX+ls+gap;
    if(logoImg){
      var lx=startX,ly=cy-ls/2;
      ctx.save();ctx.beginPath();ctx.arc(lx+ls/2,ly+ls/2,ls/2,0,Math.PI*2);ctx.closePath();ctx.clip();
      ctx.drawImage(logoImg,lx,ly,ls,ls);ctx.restore();
      ctx.beginPath();ctx.arc(lx+ls/2,ly+ls/2,ls/2,0,Math.PI*2);ctx.strokeStyle="rgba(200,169,81,0.6)";ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=4;
    ctx.font='bold 22px '+FF;ctx.fillStyle="rgba(255,255,255,0.95)";
    ctx.fillText(bn,textX,cy+(tg?-2:6));
    if(tg){ctx.font='italic 13px '+FF;ctx.fillStyle="rgba(255,255,255,0.78)";ctx.fillText(tg,textX,cy+18);}
    ctx.shadowBlur=0;
  }

  function doBrand(src){
    var c=cv.current;if(!c){setErr("Canvas unavailable");setPh("scene");return;}
    var ctx=c.getContext("2d");c.width=1024;c.height=1024;
    var im=new Image();im.crossOrigin="anonymous";
    im.onload=function(){
      ctx.clearRect(0,0,1024,1024);ctx.drawImage(im,0,0,1024,1024);
      if(lpos==="none"){var fu0=c.toDataURL("image/png");setFin(fu0);setPh("done");setSts("Ready!");api("/api/save-final",{method:"POST",body:JSON.stringify({imageData:fu0})}).catch(function(){});return;}
      var bn=cfg.brandName||"BRAND",tg=cfg.tagline||"";
      function finish(logoImg){
        ensureFonts().then(function(){
          drawText(ctx,bn,tg,lpos,logoImg);
          var fu=c.toDataURL("image/png");setFin(fu);setPh("done");setSts("Ready!");
          api("/api/save-final",{method:"POST",body:JSON.stringify({imageData:fu})}).catch(function(){});
        });
      }
      if(cfg.logoBase64){var li=new Image();li.onload=function(){finish(li);};li.onerror=function(){finish(null);};li.src=cfg.logoBase64;}
      else finish(null);
    };
    im.onerror=function(){setErr("Could not load generated image");setPh("scene");};
    im.src=src;
  }

  function doDl(){if(!fin)return;var a=document.createElement("a");a.href=fin;a.download="jewelry_marketing.png";a.click();}
  function doShare(){if(!fin||!navigator.share)return;fetch(fin).then(function(r){return r.blob();}).then(function(b){navigator.share({files:[new File([b],"jewelry.png",{type:"image/png"})],title:"Jewelry Marketing"}).catch(function(){});});}

  var tabs=isA?["create","history","users","settings","drive","allLogs"]:["create","history"];
  var tN={create:"Create",history:"History",users:"Users",settings:"Settings",drive:"Backup",allLogs:"All Logs"};
  var origin=(typeof window!=="undefined"&&window.location?window.location.origin:"");

  return h("div",{style:{minHeight:"100vh",background:"linear-gradient(135deg,"+t.bg+","+t.bg2+")",color:t.tx}},

      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
        h("span",{style:{fontSize:16}},"\u{1F48E}"),
        h("span",{style:{fontSize:13,fontWeight:"bold",color:t.g}},"Jewelry Agent"),
        h("span",{style:{fontSize:10,color:t.t2,background:dk?"rgba(255,255,255,0.05)":"rgba(0,0,0,0.05)",padding:"2px 8px",borderRadius:10}},usr?usr.username+" ("+usr.role+")":"")
      ),
      h("div",{style:{display:"flex",gap:4}},
        h("button",{onClick:function(){setDk(!dk);},style:Object.assign({},sb(false),{padding:"4px 8px",fontSize:10})},dk?"\u2600":"\uD83C\uDF19"),
        h("button",{onClick:function(){sessionStorage.removeItem("jwt");setTk("");setVw("login");setUsr(null);},style:Object.assign({},sb(false),{padding:"4px 8px",fontSize:10})},"Logout")
      )
    ),
    // Tabs
