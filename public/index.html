function fmtIST(iso){
  if(!iso)return "-";
  var d=new Date(iso); if(isNaN(d.getTime()))return iso;
  try{
    var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).formatToParts(d);
    var m={};parts.forEach(function(p){m[p.type]=p.value;});
    return m.day+"-"+m.month+"-"+m.year+" "+m.hour+":"+m.minute+":"+m.second+" "+(m.dayPeriod||"").toUpperCase();
  }catch(e){return iso;}
}

async function api(p,o){
  o=o||{};
  var tk=sessionStorage.getItem("jwt"),hd=Object.assign({},o.headers);
  if(tk)hd["Authorization"]="Bearer "+tk;
  if(!(o.body instanceof FormData))hd["Content-Type"]="application/json";
  var r;
  try{ r=await fetch(p,Object.assign({},o,{headers:hd})); }
  catch(e){ throw new Error("Could not reach server \u2014 a network issue, ad blocker, or tracking protection may be blocking this request."); }
  var txt=await r.text(),d={};
  try{ d=txt?JSON.parse(txt):{}; }catch(e){ if(!r.ok)throw new Error("Server error "+r.status); }
  if(!r.ok)throw new Error(d.error||("Error "+r.status));
  return d;
}

function dataURLtoFile(durl,name){
  var arr=durl.split(","),mime=(arr[0].match(/:(.*?);/)||[])[1]||"image/png",bstr=atob(arr[1]),n=bstr.length,u8=new Uint8Array(n);
  while(n--)u8[n]=bstr.charCodeAt(n);
  return new File([u8],name,{type:mime});
}

}

// Reusable Excel-like table: click headers to sort, per-column filter inputs.
function DataTable(props){
  var cols=props.columns,rows=props.rows||[],t=props.t;
  var sortKeyS=useState(null),sortKey=sortKeyS[0],setSortKey=sortKeyS[1];
  var sortDirS=useState(1),sortDir=sortDirS[0],setSortDir=sortDirS[1];
  var filtersS=useState({}),filters=filtersS[0],setFilters=filtersS[1];
  function val(c,r){return c.value?c.value(r):r[c.key];}
  function sval(c,r){return c.sortValue?c.sortValue(r):val(c,r);}
  function onFilter(k,v){setFilters(function(p){var o=Object.assign({},p);o[k]=v;return o;});}
  var view=rows.filter(function(r){
    return cols.every(function(c){
      if(c.noFilter)return true;var fv=(filters[c.key]||"").toString().toLowerCase();if(!fv)return true;
      var cell=val(c,r);cell=(cell==null?"":String(cell)).toLowerCase();return cell.indexOf(fv)>-1;
    });
  });
  if(sortKey){
    var col=null;for(var i=0;i<cols.length;i++)if(cols[i].key===sortKey)col=cols[i];
    if(col){view=view.slice().sort(function(a,b){
      var av=sval(col,a),bv=sval(col,b);av=av==null?"":av;bv=bv==null?"":bv;
      var sa=String(av),sb=String(bv),na=parseFloat(sa),nb=parseFloat(sb);
      if(!isNaN(na)&&!isNaN(nb)&&/^-?[\d.]+$/.test(sa.trim())&&/^-?[\d.]+$/.test(sb.trim()))return sortDir*(na-nb);
      return sortDir*sa.localeCompare(sb);
    });}
  }
  return h("div",{style:{overflowX:"auto"}},
    h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
      h("thead",null,
        h("tr",{style:{borderBottom:"2px solid "+t.bd}},cols.map(function(c){
          return h("th",{key:c.key,onClick:c.noSort?undefined:function(){if(sortKey===c.key)setSortDir(-sortDir);else{setSortKey(c.key);setSortDir(1);}},style:{padding:"6px 5px",textAlign:"left",color:t.g,fontSize:10,whiteSpace:"nowrap",cursor:c.noSort?"default":"pointer",userSelect:"none"}},
            c.label,c.noSort?"":(sortKey===c.key?(sortDir>0?" \u25B2":" \u25BC"):" \u21C5"));
        })),
        h("tr",{style:{borderBottom:"1px solid "+t.bd}},cols.map(function(c){
          return h("th",{key:c.key,style:{padding:"2px 4px"}},c.noFilter?null:h("input",{value:filters[c.key]||"",onChange:function(e){onFilter(c.key,e.target.value);},placeholder:"filter",style:{width:"100%",minWidth:58,fontSize:10,padding:"3px 5px",border:"1px solid "+t.bd,borderRadius:5,background:t.ip,color:t.tx,boxSizing:"border-box"}}));
        }))
      ),
      h("tbody",null,view.length===0
        ?h("tr",null,h("td",{colSpan:cols.length,style:{padding:16,textAlign:"center",color:t.t2}},"No matching rows"))
        :view.map(function(r,ri){
          return h("tr",{key:r.id||ri,style:{borderBottom:"1px solid "+t.bd}},cols.map(function(c){
            return h("td",{key:c.key,style:{padding:"4px 5px",color:c.dim?t.t2:t.tx,whiteSpace:c.wrap?"normal":"nowrap"}},c.render?c.render(r):val(c,r));
          }));
        })
      )
    ),
    h("div",{style:{fontSize:10,color:t.t2,marginTop:4}},view.length+" of "+rows.length+" rows")
  );
}

  function drawText(ctx,bn,tg,pos,logoImg){
    if(pos==="none")return;
    var FF='"Noto Sans Devanagari", Georgia, serif';
    var isB=pos.indexOf("bottom")===0;
    var isL=pos.indexOf("left")>0,isR=pos.indexOf("right")>0,isC=!isL&&!isR;
    var barH=78,pad=26,mg=28;
    var gy0=isB?(1024-barH-pad):0;
    var g=ctx.createLinearGradient(0,isB?gy0:0,0,isB?1024:(barH+pad));
    if(isB){g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(0.35,"rgba(0,0,0,0.4)");g.addColorStop(1,"rgba(0,0,0,0.72)");}
    else{g.addColorStop(0,"rgba(0,0,0,0.72)");g.addColorStop(0.65,"rgba(0,0,0,0.4)");g.addColorStop(1,"rgba(0,0,0,0)");}
    ctx.fillStyle=g;ctx.fillRect(0,isB?gy0:0,1024,barH+pad);
    var cy=isB?(1024-barH/2-6):(barH/2+10);
    ctx.font='bold 22px '+FF;var nameW=ctx.measureText(bn).width;
    ctx.font='italic 13px '+FF;var tagW=tg?ctx.measureText(tg).width:0;
    var textW=Math.max(nameW,tagW);
    var ls=logoImg?46:0,gap=logoImg?14:0,groupW=ls+gap+textW;
    var startX=isC?(1024-groupW)/2:(isL?mg:(1024-mg-groupW));
    var textX=startX+ls+gap;
    if(logoImg){
      var lx=startX,ly=cy-ls/2;
      ctx.save();ctx.beginPath();ctx.arc(lx+ls/2,ly+ls/2,ls/2,0,Math.PI*2);ctx.closePath();ctx.clip();
      ctx.drawImage(logoImg,lx,ly,ls,ls);ctx.restore();
      ctx.beginPath();ctx.arc(lx+ls/2,ly+ls/2,ls/2,0,Math.PI*2);ctx.strokeStyle="rgba(200,169,81,0.6)";ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=4;
    ctx.font='bold 22px '+FF;ctx.fillStyle="rgba(255,255,255,0.95)";ctx.fillText(bn,textX,cy+(tg?-2:6));
    if(tg){ctx.font='italic 13px '+FF;ctx.fillStyle="rgba(255,255,255,0.78)";ctx.fillText(tg,textX,cy+18);}
    ctx.shadowBlur=0;
  }
