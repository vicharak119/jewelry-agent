// Measure how "busy" a canvas region is (luminance variance). Lower = calmer = better for branding.
function regBusy(ctx,x,y,w,h){
  try{
    x=Math.max(0,Math.round(x));y=Math.max(0,Math.round(y));w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));
    var d=ctx.getImageData(x,y,w,h).data,sum=0,sum2=0,cnt=0,step=4*Math.max(1,Math.floor((w*h)/3000));

    if(!cnt)return {v:1e9,m:128};var m=sum/cnt;return {v:Math.max(0,sum2/cnt-m*m),m:m};
  }catch(e){return {v:1e9,m:128};}
}

}

}

async function api(p,o){
  o=o||{};
  var tk=sessionStorage.getItem("jwt"),hd=Object.assign({},o.headers);
  if(tk)hd["Authorization"]="Bearer "+tk;
  if(!(o.body instanceof FormData))hd["Content-Type"]="application/json";
  var r;
  try{ r=await fetch(p,Object.assign({},o,{headers:hd})); }
  catch(e){ throw new Error("Could not reach server \u2014 a network issue, ad blocker, or tracking protection may be blocking this request."); }
  var txt=await r.text(),d={};
  try{ d=txt?JSON.parse(txt):{}; }catch(e){ if(!r.ok)throw new Error("Server error "+r.status); }
  if(!r.ok)throw new Error(d.error||("Error "+r.status));
  return d;
}

  function runBatch(list){
    var results=list.map(function(d){return {disp:d,status:"pending",fin:null,err:null};});
    setErr("");setFin(null);setGenSrc(null);setBatch(results.slice());setPh("gen");setProg(2);
    var N=list.length;
    function step(i){
      if(i>=N){setPh("done");setProg(100);setSts("Done \u2014 "+N+" images");return;}
      var d=list[i];
      results[i]=Object.assign({},results[i],{status:"generating"});setBatch(results.slice());
      setProg(Math.round((i/N)*100)+3);setSts("Generating "+(i+1)+" of "+N+" \u2014 "+dispLabel(d)+"...");
      var body={prompt:buildPrompt(d),model:cfg.model,quality:cfg.quality,size:cfg.size,analysis:an,scene:sc,style:sty,display:d,inputFile:an.inputFile,branding:brandingMeta()};
      if(refImg)body.referenceImage=refImg;
      api("/api/generate",{method:"POST",body:JSON.stringify(body)}).then(function(dd){
        var url=dd.b64_json?"data:image/png;base64,"+dd.b64_json:dd.url;if(!url)throw new Error("No image returned");
        return brandToDataURL(url,{});
      }).then(function(fu){
        results[i]=Object.assign({},results[i],{status:"done",fin:fu});setBatch(results.slice());
        return api("/api/save-final",{method:"POST",body:JSON.stringify({imageData:fu})}).catch(function(){});
      }).then(function(){step(i+1);}).catch(function(e){
        results[i]=Object.assign({},results[i],{status:"error",err:e.message});setBatch(results.slice());step(i+1);
      });
    }
    step(0);
  }



  // v8.9: each of logo / name / tagline can be drawn independently (showLogo/showName/showTagline).
  function drawText(ctx,bn,tg,pos,logoImg,W,H,sizes,showLogo,showName,showTagline){
    if(!pos||pos==="none")pos="bottom-center";
    var FF='"Noto Sans Devanagari", Georgia, serif';
    var hasLogo=!!(showLogo&&logoImg);
    var nm=showName?(bn||""):"",tgl=showTagline?(tg||""):"";
    var showText=!!nm||!!tgl;
    if(!hasLogo&&!showText)return;
    var logoD=Math.round(W*(((sizes&&sizes.logoPct)||12)/100));
    var nameSize=Math.round(H*(((sizes&&sizes.namePct)||5)/100));
    var tagSize=Math.round(H*(((sizes&&sizes.taglinePct)||3)/100));
    var mg=Math.round(W*0.035);
    // Detect the logo's true shape by trimming transparent padding, then keep its aspect ratio.
    var lw=0,lh=0,srcX=0,srcY=0,srcW=0,srcH=0,beside=true;
    if(hasLogo){
      var nw=logoImg.naturalWidth||logoImg.width||1,nh=logoImg.naturalHeight||logoImg.height||1;
      srcW=nw;srcH=nh;
      try{
        var sW=Math.min(220,nw),sH=Math.max(1,Math.round(nh*sW/nw));
        var tc=document.createElement("canvas");tc.width=sW;tc.height=sH;
        var tcx=tc.getContext("2d");tcx.drawImage(logoImg,0,0,sW,sH);
        var dat=tcx.getImageData(0,0,sW,sH).data,minX=sW,minY=sH,maxX=-1,maxY=-1;
        for(var yy=0;yy<sH;yy++)for(var xx=0;xx<sW;xx++){if(dat[(yy*sW+xx)*4+3]>16){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}}
        if(maxX>=minX&&maxY>=minY){var scF=nw/sW;srcX=Math.floor(minX*scF);srcY=Math.floor(minY*scF);srcW=Math.ceil((maxX-minX+1)*scF);srcH=Math.ceil((maxY-minY+1)*scF);}
      }catch(e){}
      var aspect=srcW/srcH;
      if(aspect>=1){lw=logoD;lh=Math.round(logoD/aspect);}else{lh=logoD;lw=Math.round(logoD*aspect);}
      beside=(aspect>=0.8&&aspect<=1.25); // square/round -> text beside; rectangle -> text below
    }
    ctx.font='bold '+nameSize+'px '+FF;var nameW=nm?ctx.measureText(nm).width:0;
    ctx.font='italic '+tagSize+'px '+FF;var tagW=tgl?ctx.measureText(tgl).width:0;
    var textW=Math.max(nameW,tagW),textH=(nm?nameSize:0)+(tgl?(nm?Math.round(tagSize*1.2):tagSize):0);
    var combo=hasLogo&&showText;
    var gap=combo?Math.round(logoD*0.26):0;
    var groupW,groupH;
    if(combo&&!beside){groupW=Math.max(lw,textW);groupH=lh+gap+textH;}
    else if(combo){groupW=lw+gap+textW;groupH=Math.max(lh,textH);}
    else if(hasLogo){groupW=lw;groupH=lh;}
    else{groupW=textW;groupH=textH;}
    var isB=pos.indexOf("bottom")===0,isL=pos.indexOf("left")>0,isR=pos.indexOf("right")>0,isC=!isL&&!isR;
    var gx=isC?Math.round((W-groupW)/2):(isL?mg:(W-mg-groupW));
    var gy=isB?(H-mg-groupH):mg;
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    function drawLogoAt(dx,dy){ctx.save();ctx.shadowColor="rgba(0,0,0,0.4)";ctx.shadowBlur=Math.round(logoD*0.13);ctx.shadowOffsetY=Math.round(logoD*0.03);ctx.drawImage(logoImg,srcX,srcY,srcW,srcH,dx,dy,lw,lh);ctx.restore();}
    function drawTextBlock(tx,topY,align){
      ctx.save();ctx.textAlign=align||"left";ctx.textBaseline="alphabetic";
      ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=Math.round(nameSize*0.45);ctx.shadowOffsetY=Math.round(nameSize*0.06);
      if(nm){ctx.font='bold '+nameSize+'px '+FF;ctx.fillStyle="rgba(255,255,255,0.98)";ctx.fillText(nm,tx,topY+nameSize);}
      if(tgl){ctx.font='italic '+tagSize+'px '+FF;ctx.fillStyle="rgba(255,255,255,0.9)";ctx.fillText(tgl,tx,topY+(nm?nameSize+Math.round(tagSize*1.2):tagSize));}
      ctx.restore();
    }
    if(combo&&!beside){drawLogoAt(gx+Math.round((groupW-lw)/2),gy);drawTextBlock(gx+Math.round(groupW/2),gy+lh+gap,"center");}
    else if(combo){drawLogoAt(gx,gy+Math.round((groupH-lh)/2));drawTextBlock(gx+lw+gap,gy+Math.round((groupH-textH)/2),"left");}
    else if(hasLogo){drawLogoAt(gx,gy);}
    else{var al=isC?"center":(isR?"right":"left");var tx=isC?Math.round(W/2):(isR?(W-mg):mg);drawTextBlock(tx,gy,al);}
  }

  // v8.9: single, centered, faint watermark image drawn over the photo (under logo/text/code).
  function drawWatermark(ctx,wmImg,W,H,pct,opacity){
    var ww=Math.round(W*((pct||60)/100));
    var nw=wmImg.naturalWidth||wmImg.width||1,nh=wmImg.naturalHeight||wmImg.height||1;
    var wh=Math.max(1,Math.round(ww*nh/nw));
    var x=Math.round((W-ww)/2),y=Math.round((H-wh)/2);
    ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,(opacity==null?12:opacity)/100));
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(wmImg,x,y,ww,wh);ctx.restore();
  }

  function drawCode(ctx,code,pos,W,H,sizes){
    if(!code)return;
    var FF='"Noto Sans Devanagari", Georgia, serif';
    var sz=Math.round(H*(((sizes&&sizes.codePct)||3)/100)),mg=Math.round(W*0.035);
    ctx.save();ctx.font='bold '+sz+'px '+FF;ctx.textBaseline="alphabetic";
    var w=ctx.measureText(code).width;
    var x=(pos.indexOf("center")>0)?((W-w)/2):((pos.indexOf("left")>0)?mg:(W-mg-w));
    var y=(pos.indexOf("top")===0)?(mg+sz):(H-mg);
    ctx.textAlign="left";ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=Math.round(sz*0.4);ctx.shadowOffsetY=Math.round(sz*0.06);
    ctx.fillStyle="rgba(255,255,255,0.96)";ctx.fillText(code,x,y);
    ctx.restore();
  }

  function brandToDataURL(src,opts){
    return new Promise(function(resolve,reject){
      opts=opts||{};
      var pick=function(o,s){return o!==undefined&&o!==null?o:s;};
      var uLpos=pick(opts.lpos,lpos);
      var uCode=pick(opts.pcode,pcode);
      var uCodePos=pick(opts.pcodePos,pcodePos);
      // Which elements to include (toggles); opts can override for special cases.
      var sLogo=!!pick(opts.incLogo,incLogo),sName=!!pick(opts.incName,incName),sTag=!!pick(opts.incTagline,incTagline),sWM=!!pick(opts.incWatermark,incWatermark),sCode=!!pick(opts.incCode,incCode);
      var pnum=function(o,c,d){var v=parseFloat(o);if(!isNaN(v))return v;v=parseFloat(c);return isNaN(v)?d:v;};
      var sizes={
        logoPct:pnum(opts.logoPct!==undefined?opts.logoPct:ovr.logoPct,cfg.logoPct,12),
        namePct:pnum(opts.namePct!==undefined?opts.namePct:ovr.namePct,cfg.namePct,5),
        taglinePct:pnum(opts.taglinePct!==undefined?opts.taglinePct:ovr.taglinePct,cfg.taglinePct,3),
        codePct:pnum(opts.codePct!==undefined?opts.codePct:ovr.codePct,cfg.codePct,3)
      };
      var wmPct=pnum(cfg.watermarkPct,null,60),wmOp=pnum(cfg.watermarkOpacity,null,12);
      var c=cv.current;if(!c){reject(new Error("Canvas unavailable"));return;}
      var ctx=c.getContext("2d");c.width=1024;c.height=1024;
      var im=new Image();im.crossOrigin="anonymous";
      im.onload=function(){
        ctx.clearRect(0,0,1024,1024);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(im,0,0,1024,1024);
        var useAi=pick(opts.aiPlace,aiPlace);
        var hasBrandText=sLogo||sName||sTag;
        if(useAi){
          if(hasBrandText)uLpos=pickAutoPos(ctx,1024,1024);
          sizes={logoPct:12,namePct:5,taglinePct:3,codePct:3};
        }
        var bn=cfg.brandName||"BRAND",tg=cfg.tagline||"";
        var codeText=sCode?(uCode||"").trim():"";
        var codePos=uCodePos||cfg.codePos||"top-right";
        if(useAi&&codeText)codePos=pickCodePos(ctx,1024,1024,uLpos);
        function finish(logoImg,wmImg){
          ensureFonts().then(function(){
            if(wmImg)drawWatermark(ctx,wmImg,1024,1024,wmPct,wmOp);
            if(hasBrandText)drawText(ctx,bn,tg,uLpos,logoImg,1024,1024,sizes,sLogo,sName,sTag);
            if(codeText)drawCode(ctx,codeText,codePos,1024,1024,sizes);
            resolve(c.toDataURL("image/png"));
          });
        }
        function afterLogo(logoImg){
          if(sWM&&cfg.watermarkBase64){var wi=new Image();wi.onload=function(){finish(logoImg,wi);};wi.onerror=function(){finish(logoImg,null);};wi.src=cfg.watermarkBase64;}
          else finish(logoImg,null);
        }
        if(sLogo&&cfg.logoBase64){var li=new Image();li.onload=function(){afterLogo(li);};li.onerror=function(){afterLogo(null);};li.src=cfg.logoBase64;}
        else afterLogo(null);
      };
      im.onerror=function(){reject(new Error("Could not load generated image"));};
      im.src=src;
    });
  }
